<meta charset="utf-8">
<title>Testes do algoritmo</title>
<pre id="saida"></pre>
<script>
  // Mostra o console na página para conferir os testes sem Node.
  const saida = document.getElementById('saida');
  const log = (...a) => (saida.textContent += a.join(' ') + '\n');
  console.log = log;
  window.onerror = (m, u, l) => log('ERRO:', m, 'linha', l);
</script>
